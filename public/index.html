<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regalo grupal · Participantes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">LISTA COMPARTIDA</p><h1>Regalo grupal</h1></div><a href="/pantalla.html">Abrir pantalla ↗</a></header>
    <section id="login" class="panel"><h2>Sumate a la lista</h2><form id="join-form"><label for="name">Tu nombre</label><div class="row"><input id="name" maxlength="30" required placeholder="Ej. Alex"><button>Entrar</button></div></form></section>
    <section id="app" hidden>
      <div class="panel participants"><div><h2>Participantes</h2><p id="people">Conectando…</p></div><span id="connection" class="badge">Conectando</span></div>
      <section class="panel"><h2>Proponer productos</h2><p class="muted">Ingresá hasta 10 IDs del catálogo DummyJSON, separados por coma.</p><form id="proposal-form"><label for="ids">IDs de productos</label><div class="row"><input id="ids" placeholder="1, 3, 12" inputmode="numeric" required><button id="propose-button">Consultar catálogo</button></div></form><div id="feedback" aria-live="polite"></div></section>
      <section><div class="section-heading"><h2>Ranking</h2><span id="count" class="muted"></span></div><div id="products" class="grid"></div></section>
    </section>
  </main>
  <script type="module" src="/participant.js"></script>
</body>
</html>
